# github-to-gitea.ini - settings of github-to-gitea.py. Edit them from the menu
# (./github-to-gitea.py) or by hand. This file holds tokens: mode 600.
#
# [sources] list: one source per line.
#   wekan/wekan   imports only this repository from GitHub into the Gitea repository wekan/wekan
#   wekan         imports EVERY repository of the organisation (or user) into the Gitea organisation wekan

[gitea]
url = http://localhost:2000
token = 

[github]
token = ghp_

[sources]
list = 

[options]
assets_dir = gitea-update/update/releases
steps = migrate, git, issues, releases, actions
replace_broken = no
dry_run = no
include_forks = yes
include_archived = yes
wiki = yes
lfs = yes
release_assets = none
assets_max_mb = 2048
bare_repo = ~/gitea/data/gitea-repositories/{owner}/{name}.git
actions_branch = gitea-actions
